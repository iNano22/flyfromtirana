# --- Routes (from origin) ----------------------------------------------------
# iata:      destination airport (or city) code
# city:      Albanian name used in posts;  city_en: English name for hotel searches
# airport:   optional label for cities with several airports, shown as "MILANO (Bergamo)"
# absolute_threshold_eur: any one-way price at/below this is a deal.
#   These are starting guesses - tune them once you see real prices.
routes:
  - { iata: MXP, city: Milano,    city_en: Milan,     flag: "🇮🇹", airport: Malpensa,  absolute_threshold_eur: 30 }
  - { iata: BGY, city: Milano,    city_en: Milan,     flag: "🇮🇹", airport: Bergamo,   absolute_threshold_eur: 25 }
  - { iata: FCO, city: Romë,      city_en: Rome,      flag: "🇮🇹", airport: Fiumicino, absolute_threshold_eur: 30 }
  - { iata: CIA, city: Romë,      city_en: Rome,      flag: "🇮🇹", airport: Ciampino,  absolute_threshold_eur: 25 }
  - { iata: BLQ, city: Bolonjë,   city_en: Bologna,   flag: "🇮🇹", absolute_threshold_eur: 30 }
  - { iata: VCE, city: Venecia,   city_en: Venice,    flag: "🇮🇹", absolute_threshold_eur: 30 }
  - { iata: NAP, city: Napoli,    city_en: Naples,    flag: "🇮🇹", absolute_threshold_eur: 30 }
  - { iata: ATH, city: Athinë,    city_en: Athens,    flag: "🇬🇷", absolute_threshold_eur: 40 }
  - { iata: SKG, city: Selanik,   city_en: Thessaloniki, flag: "🇬🇷", absolute_threshold_eur: 40 }
