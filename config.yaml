# --- Routes (from origin) ----------------------------------------------------
# iata:      destination airport (or city) code
# city:      the city's English name, shown in the Telegram posts and on the website (e.g. Vienna)
# city_en:   optional: a different spelling for hotel search links (defaults to city)
# airport:   optional label for cities with several airports, shown as "MILAN (Bergamo)"
# absolute_threshold_eur: any one-way price at/below this is a deal.
#   These are starting guesses - tune them once you see real prices.
routes:
  - { iata: MXP, city: Milan,        flag: "🇮🇹", airport: Malpensa,  absolute_threshold_eur: 15 }
  - { iata: BGY, city: Milan,        flag: "🇮🇹", airport: Bergamo,   absolute_threshold_eur: 12 }
  - { iata: FCO, city: Rome,         flag: "🇮🇹", airport: Fiumicino, absolute_threshold_eur: 15 }
  - { iata: CIA, city: Rome,         flag: "🇮🇹", airport: Ciampino,  absolute_threshold_eur: 12 }
  - { iata: BLQ, city: Bologna,      flag: "🇮🇹", absolute_threshold_eur: 15 }
  - { iata: VCE, city: Venice,       flag: "🇮🇹", absolute_threshold_eur: 15 }
  - { iata: NAP, city: Naples,       flag: "🇮🇹", absolute_threshold_eur: 15 }
  - { iata: ATH, city: Athens,       flag: "🇬🇷", absolute_threshold_eur: 40 }
  - { iata: SKG, city: Thessaloniki, flag: "🇬🇷", absolute_threshold_eur: 40 }
  - { iata: LHR, city: London,       flag: "🇬🇧", airport: Heathrow,  absolute_threshold_eur: 60 }
  - { iata: STN, city: London,       flag: "🇬🇧", airport: Stansted,  absolute_threshold_eur: 35 }
  - { iata: LTN, city: London,       flag: "🇬🇧", airport: Luton,     absolute_threshold_eur: 35 }
  - { iata: MUC, city: Munich,       flag: "🇩🇪", absolute_threshold_eur: 40 }
  - { iata: FRA, city: Frankfurt,    flag: "🇩🇪", absolute_threshold_eur: 50 }
  - { iata: STR, city: Stuttgart,    flag: "🇩🇪", absolute_threshold_eur: 40 }
  - { iata: DUS, city: Düsseldorf,   flag: "🇩🇪", absolute_threshold_eur: 40 }
  - { iata: VIE, city: Vienna,       flag: "🇦🇹", absolute_threshold_eur: 35 }
  - { iata: ZRH, city: Zurich,       flag: "🇨🇭", absolute_threshold_eur: 50 }
  - { iata: BCN, city: Barcelona,    flag: "🇪🇸", absolute_threshold_eur: 45 }
  - { iata: MAD, city: Madrid,       flag: "🇪🇸", absolute_threshold_eur: 50 }
  - { iata: IST, city: Istanbul,     flag: "🇹🇷", absolute_threshold_eur: 50 }
