# FlyFromTirana configuration.
# Secrets (API tokens, marker) are NOT kept here. They come from environment
# variables: .env locally (see .env.example), the deploy tool's environment
# variables on the server.

brand: FlyFromTirana
channel_handle: "@flyfromtirana"   # shown in the post footer
origin: TIA
language: sq                       # post template = templates/sq.txt (add templates/en.txt for English)
timezone: Europe/Tirane            # used for "today" and quiet hours

# --- Scanning ----------------------------------------------------------------
lookahead_days: 60                 # scan departures from tomorrow up to 60 days ahead
full_run_every_minutes: 15         # scan, post to the free channel and rebuild the site this often. 15 while the
                                   # channels grow (with premium off); later 180 again, with premium back on.
                                   # Must fit a day evenly (15, 30, 60, 180...). The site's wording follows it.
currency: eur
market: null                       # optional Travelpayouts "market" (which price cache to read); null = API default
request_delay_seconds: 0.15        # pause between API calls: ~750 a run for 126 routes, about 130 a minute
                                   # (the limit for prices_for_dates is 600 a minute), so a run takes ~6 minutes
max_price_age_days: 2              # the API's prices are what Aviasales users found, up to a week ago, and
                                   # cheap seats sell out fast: skip prices found more than this many days
                                   # ago (posts, site, alerts, trip watches). 0 = today only, null = any age.
scan_return_flights: true          # also scan DEST -> TIA so posts can show "Kthimi nga €X"

# --- Deal detection ----------------------------------------------------------
# A price is a deal if EITHER:
#   - it is at least deal_discount_pct % cheaper than the route's median price
#     over the last median_window_days (40 -> price <= 60% of the median), OR
#   - it is at/below the route's absolute_threshold_eur (see routes below)
#     AND at least threshold_min_discount_pct cheaper than the median
#     (so we never post weak deals like "€14, usually ~€18").
deal_discount_pct: 40
threshold_min_discount_pct: 25
median_window_days: 30
min_samples_for_median: 10         # ignore the median until we've seen this many prices for a route
repost_cooldown_days: 7            # don't repost the same route + date + price band within 7 days
price_band_eur: 10                 # €20-29.99 = one band, €30-39.99 = the next, ...
date_price_tolerance_pct: 10       # extra dates listed in a post must be within 10% of its headline price
return_min_days: 2                 # "Kthimi nga" = cheapest flight back 2..14 days after departure
return_max_days: 14

# --- Posting -----------------------------------------------------------------
max_posts_per_run: 1               # best deal first; with a run every 15 minutes that is up to 4 posts an hour
max_dates_per_post: 4
post_photos: true                  # send each post with the destination's photo (assets/telegram/<iata>.jpg).
                                   # false = text only, as before.
quiet_hours:                       # still scan at night, but don't post (local time). null = always post.
  start: "23:00"                   # keep the quotes - YAML reads 23:00 as a number otherwise
  end: "08:00"

# --- Premium channel (paid, private) -----------------------------------------
# Premium gets deals within minutes and with looser rules; the free channel
# only posts a deal after premium has had it for free_delay_hours (at its next
# full run after that), with a "Premium members got this X hours earlier ·
# Join" line. The website waits the same way: it leaves a premium deal's price
# out until the free channel may have it. The wait is per price: when a date's
# price falls into a cheaper band (price_band_eur), premium gets the new price
# first and the hours count from that post.
# To turn on: create the private channel, add the bot as admin, set the
# TELEGRAM_PREMIUM_CHANNEL_ID secret, paste the paid invite link below, enabled: true.
premium:
  enabled: false                   # off while the channels grow: everyone gets every deal within 15 minutes
                                   # and the site shows nothing about premium. To bring it back (about 1,000
                                   # members): enabled: true, free_delay_hours: 6, full_run_every_minutes: 180.
  free_delay_hours: 0              # with 0, premium still gets a deal first, at its quick scan, and the free
                                   # channel and site at the next full run; the site then says that run's hours.
  scan_every_minutes: 15           # premium checks prices this often and posts a new deal straight away
                                   # (outside quiet hours). 0 = only with the full runs.
  max_posts_per_run: 1             # per scan, so up to 4 an hour: the best new deal each time
  join_link: "https://t.me/+IwCW3S2em3c2Zjhk"   # paid subscription invite link
  deal_discount_pct: 30            # looser than the free channel's 40 -> more deals
  threshold_min_discount_pct: 20

# --- Instagram and Facebook posts --------------------------------------------
# At each of `post_times` the bot posts the best deal on the website that the
# accounts haven't had yet: it draws a feed card and a story card (src/cards.py)
# and writes the caption (templates/sq_social.txt, sq_facebook.txt). With
# META_PAGE_TOKEN set it posts them itself on the platforms under `publish` and
# reports to the chat in TELEGRAM_DRAFTS_CHAT_ID (or TELEGRAM_ALERT_CHAT_ID);
# without the token, or when a post fails, that chat gets the pictures and the
# caption as a draft to post by hand. README: "Instagram and Facebook posts".
social:
  enabled: true
  post_times: ["12:00", "19:30"]   # local; the post goes out at the first run at or after each time (the
                                   #   scanner wakes every 15 minutes). One post per time, so a day has at
                                   #   most this many, hours apart, when people are on their phones. Keep the
                                   #   quotes: YAML reads 12:00 as a number. Never the same city twice a day.
  handle: "@flyfromtirana"         # the account's name, shown on the cards
  sub_id: facebook                 # Travelpayouts SubID of the booking link in the Facebook post
  hashtags: "#flyfromtirana #fluturime #oferta #udhetim #tirana #rinas #biletaavioni #pushime"
  publish: [instagram, facebook]   # instagram = a feed post + a story; facebook = a Page post with the link
  reels: true                      # a deal goes to Instagram as a Reel (a 10-second video of its card, with
                                   #   music from assets/music) instead of the feed picture; the story and
                                   #   Facebook keep the pictures. The weekly top and the guides stay carousels.
  keep_pictures_days: 7            # Instagram fetches the pictures from the website (/social/); kept this long
  # Keeping the accounts busy on quiet days:
  weekly_day: sunday               # on this day the first post is a "TOP 5 ofertat e javës" carousel (cover +
  weekly_count: 5                  #   one card per deal) instead of a deal; empty = never. It needs at least
                                   #   3 deals on the website. A day with no post at all gets a city-guide
                                   #   post at its last post time: the city posted least recently.

# --- Growing the free channel ------------------------------------------------
# Every place that advertises the free channel has its own invite link, so you can see
# where new members come from: the weekly report below counts the joins per link, and
# the Telegram app shows them too (the channel -> Manage channel -> Invite links).
# The bot makes the missing ones: python scripts/invite_links.py (prints them for here).
# A place left empty uses the public address, https://t.me/flyfromtirana.
invite_links:
  instagram: "https://t.me/+YZWmRH9QTKY1MDE8"   # for the Instagram bio, put there by hand (captions can't hold
                                                #   a link: they say "t.me/flyfromtirana (linku në bio)")
  facebook: "https://t.me/+awIXbIIcDW8xOGNk"    # the Facebook posts
  website: "https://t.me/+IlHwEzGyG5QxZTFk"     # every Telegram button on the website
  whatsapp: "https://t.me/+kW1zUnh8_n05Yjg0"    # the message the "Dërgoja një shoku në WhatsApp" links send
                                                #   (the free channel's posts and the site's deals)
  bot: "https://t.me/+TPN1uet2WnM2YjQ0"         # the channel link in the price alerts and the bot's messages
growth:
  report_day: monday               # your chat (TELEGRAM_DRAFTS_CHAT_ID, or else TELEGRAM_ALERT_CHAT_ID) gets
  report_time: "09:00"             #   the week's numbers at the first full run after this time (local;
                                   #   full runs are every 3 hours). Empty day = no report. Keep the quotes.

# --- Price alerts --------------------------------------------------------------
# In a private chat with the bot, people pick a city and a price ("tell me when Milan is
# under €30", or "any deal"). After each scan, everyone whose city has a flight at that price
# or cheaper gets a message with the booking link (src/alerts.py), once per city and price
# band within repost_cooldown_days. Free alerts wait like the website and the free channel:
# a deal Premium is still getting first comes once the free channel may have it. Premium
# members get theirs straight away, also from the 15-minute premium scans. Nothing goes out
# in quiet hours. The bot's chat (src/bot.py) runs inside the scanner container.
alerts:
  enabled: true
  bot_username: FlyFromTiranaBot   # for the "Më njofto kur bie çmimi" links in the channel posts
  prices: [20, 30, 40, 50, 70, 100]   # the price buttons, in euros (plus "Çdo ofertë")
  max_per_person: 10
  sub_id: alerts                   # Travelpayouts SubID of the booking links in the alerts

# --- Your own trip watches ------------------------------------------------------
# Trips only you hear about: after each full scan (every 3 hours) the bot writes to your own chat
# (TELEGRAM_DRAFTS_CHAT_ID, or else TELEGRAM_ALERT_CHAT_ID) when a trip that fits costs max_price
# or less, and again when it gets cheaper (src/trips.py). Not in quiet hours. The destination
# needn't be one of the routes below: nothing about it goes to the channels or the website.
# To see what a watch finds right now: python -m src.trips
trip_watches:
  - name: Memmingen before Christmas
    destination: FMM                 # Memmingen airport (Wizz Air and Ryanair fly there from Tirana)
    city: Memmingen
    earliest_departure: 2026-12-01
    latest_return: 2026-12-24        # back by Christmas Eve
    min_days: 3                      # how long, counting the day you fly out and the day you fly
    max_days: 4                      #   back: Friday to Sunday is 3 days, Thursday to Sunday 4
    weekend: true                    # the trip must include a Saturday and a Sunday
    max_price: 100                   # euros, both flights together; empty = any price

# --- Website -----------------------------------------------------------------
# src/website.py renders one page from the price database into output_dir. On
# the server the scheduler rebuilds it after every scan and the `web` container
# serves that folder (docker-compose.yml).
website:
  output_dir: docs                 # the server mounts its site volume here
  # The site's languages. The first one is the main one: its pages are at the top of the site
  # (/, /milan/). The others get a folder each (/en/, /en/milan/, /it/, ...). Each language needs
  # its wording (templates/strings/<code>.yaml) and its city guides (content/destinations/<code>/).
  # The Telegram posts are not affected: they stay in `language` (top of this file).
  languages: [sq, en, it]
  sub_id: website                  # Travelpayouts SubID for links on the site ("telegram" is used in posts)
  url: https://flyfromtirana.al/             # public address: linked at the bottom of every post, and
                                             # used for the page's canonical/og:url tags. The old
                                             # address, flyfromtirana.devbay.cloud, still serves the
                                             # same site (both are set on the `web` service).
  # Google Analytics, to count visitors. Paste the GA4 Measurement ID ("G-XXXXXXXXXX") from
  # analytics.google.com (Admin -> Data streams -> your web stream). Empty = no Google Analytics.
  google_analytics_id: "G-W3PTGHESC1"
  # false: every visitor is counted from the first page; a box tells them and lets them refuse.
  # true:  nothing is loaded from Google until the visitor presses "Pranoj". That is what the
  #        EU's cookie rules ask for, but visitors who ignore the box are then not counted.
  google_analytics_ask_first: false
  # Who runs the site and where visitors can write about their data: both are shown on the
  # privacy page (/privacy/). Leave either empty and that part of the page is left out.
  operator: Devbay.cloud
  contact_email: hello@devbay.cloud
  # Travelpayouts Drive: the script of the "Flyfromtirana" project (dashboard -> Drive). Only its
  # address goes here: the one in script.src = '...' in the snippet they give. What Drive does on
  # the pages (keyword links, offers, previews) is switched on and off in the dashboard.
  # Empty = no Drive on the site.
  # Switched off in Oct 2026: Travelpayouts could not connect the project to Booking.com and
  # Viator, and Drive's keyword links do not work without them. To put it back, once those
  # programs are open to the project: "https://emrldtp.cc/NTgzODE4.js?t=583818"
  travelpayouts_drive_script: ""
  # GetYourGuide's widget on every city page: a grid of that city's tours and activities, with
  # photos, which GetYourGuide fills in and keeps up to date itself. This is how many activities
  # it shows; 0 = no widget. It uses the Partner ID and the city pages of the tours link
  # (links.partners.tours and links.city_pages.tours, further down), so it only appears once
  # that link is switched on. It is shown in Italian on the Italian pages and in English on the
  # others: GetYourGuide has no Albanian.
  getyourguide_activities: 8

  # The site's own affiliate links, made in its own Travelpayouts project
  # ("Flyfromtirana"), so the site's clicks are counted there and not under the
  # Telegram project. Same shape as `links:` below. Anything left out here uses
  # the link from `links:`.
  links:
    flight:
      # The site's Aviasales short link, used as a redirect: with ?u=... added it
      # opens that Aviasales page (a search for one route and date) instead of
      # the homepage, and the click is counted under the site's project.
      # Travelpayouts puts its own marker on the link, so the "website" SubID is
      # not used here. Empty = the plain Aviasales link with marker.website.
      wrapper: "https://aviasales.tp.st/XXen6cDo?u={url}"
    partners:
      esim:
        url: "https://airalo.tp.st/3G2AG28z"          # Airalo
      insurance:
        url: ""                                       # EKTA closed in Oct 2026 (see `links:` below)
      compensation:
        url: "https://airhelp.tp.st/IQSDOJpj"         # AirHelp
      car_rental:
        url: "https://getrentacar.tp.st/Z8ZRzVQV"     # GetRentacar
      # The three below open a city's own page where there is one (city_pages under `links:`),
      # so each has the site's short link as a wrapper, like the flight link above.
      tickets:                                        # Tiqets: museum and attraction tickets
        url: "https://www.tiqets.com/en/"
        wrapper: "https://tiqets.tp.st/Z99xzVot?u={url}"
      transfer:                                       # Welcome Pickups: airport transfers
        url: "https://www.welcomepickups.com/"
        wrapper: "https://tp.st/4kttr89i?u={url}"
      luggage:                                        # Radical Storage: luggage storage
        url: "https://radicalstorage.com/"
        wrapper: "https://radicalstorage.tp.st/dXBrRhJg?u={url}"

# --- Storage -----------------------------------------------------------------
db_path: data/prices.db
history_retention_days: 45         # older price rows are deleted so the database stays small

# --- Affiliate links (all built in src/links.py) -----------------------------
links:
  sub_id: telegram                 # Travelpayouts SubID: shows which channel earned the click

  flight:
    base_url: https://www.aviasales.com
    # Optional: wrap flight links in the Travelpayouts tracking redirect.
    # Aviasales is program p=4114, campaign_id=100; trs = your Travelpayouts project ID:
    #   wrapper: "https://tp.media/r?marker={marker}&trs=YOUR_PROJECT_ID&p=4114&campaign_id=100&u={url}"
    # Empty = plain Aviasales link with ?marker=... (also tracked).
    wrapper: ""

  # Other affiliate programs. Each one becomes a {NAME_LINK} placeholder in the
  # post template (hotel -> {HOTEL_LINK}). While `url` is empty, the post leaves
  # that link out. You can add more, e.g. car_rental -> {CAR_RENTAL_LINK}.
  #
  # Placeholders you can use in url:  {city} {city_en} {iata} {origin} {checkin} {checkout} {marker} {sub_id}
  # Placeholders you can use in wrapper:  {url} (the finished url, encoded) {plain_url} (the same,
  #   as it is: for a program that adds its ID to the end of the address) {marker} {sub_id}
  # Or paste a ready-made link from the Travelpayouts link generator as url, with no wrapper.
  partners:
    hotel:
      # Hotellook closed in Oct 2025. Join Booking.com / Trip.com / Agoda in Travelpayouts, e.g.:
      #   url: "https://www.booking.com/searchresults.html?ss={city_en}&checkin={checkin}&checkout={checkout}"
      #   wrapper: "https://tp.media/r?marker={marker}&trs=YOUR_PROJECT_ID&p=PROGRAM_ID&campaign_id=CAMPAIGN_ID&u={url}"
      url: ""
      wrapper: ""
    esim:
      url: "https://airalo.tp.st/kR78iHcI"   # Airalo, generated in Travelpayouts (Tools -> Links)
      wrapper: ""
    insurance:
      # EKTA closed in Oct 2026: its links stopped taking bookings on Oct 8. Join another
      # insurance program in Travelpayouts (they suggest VisitorsCoverage or Insubuy) and paste
      # its link here and under website.links. While empty, posts and the site leave insurance out.
      url: ""
      wrapper: ""
    compensation:                  # flight delay/cancellation claims
      url: "https://airhelp.tp.st/bZg6g8jh"        # AirHelp
      wrapper: ""
    car_rental:
      url: "https://getrentacar.tp.st/zqdZHOw2"    # GetRentacar
      wrapper: ""
    # The three below open a city's own page where there is one (city_pages, further down), so
    # each has the Telegram project's short link as a wrapper: with ?u=... added it opens that
    # page instead of the partner's homepage. `url` is where it goes for a city without a page.
    tickets:                       # Tiqets: museum and attraction tickets
      url: "https://www.tiqets.com/en/"
      wrapper: "https://tiqets.tp.st/VmHfUFkI?u={url}"
    transfer:                      # Welcome Pickups: airport transfers
      url: "https://www.welcomepickups.com/"
      wrapper: "https://tp.st/FOXpwIDB?u={url}"
    luggage:                       # Radical Storage: luggage storage
      url: "https://radicalstorage.com/"
      wrapper: "https://radicalstorage.tp.st/0j7EaQvI?u={url}"
    # GetYourGuide: guided tours, day trips and activities. It is GetYourGuide's own partner
    # program (partner.getyourguide.com), not Travelpayouts, so there is no short link: the link
    # is the page's own address with your Partner ID added to its end. cmp is the campaign name
    # their statistics show: "telegram" for the posts, "website" for the site. The site's city
    # pages also show GetYourGuide's widget, with this same ID (website.getyourguide_activities).
    # 0Y4RGTR is this account's Partner ID (dashboard -> Tools -> Links shows it in every link).
    # To switch GetYourGuide off, set url to "": the posts and the site then leave it out, the
    # widget too.
    tours:
      url: "https://www.getyourguide.com/"
      wrapper: "{plain_url}?partner_id=0Y4RGTR&cmp={sub_id}"

  # A partner's own page for a city. A post about a flight to Milan, and the site's Milan page,
  # link to these instead of the partner's `url` above; the site's main page, which is about no
  # one city, keeps `url`. The city is written as in `routes`. The posts and the site share this
