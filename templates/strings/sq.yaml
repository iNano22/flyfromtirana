# The wording of the website in Albanian. One file like this per language of the site
# (website.languages in config.yaml), all with the same keys: a test fails when one is missing.
#
# page:   the text in the page templates. {T_NAME} in a template is the entry NAME here.
#         An entry is a piece of template: it may hold HTML, values like {CITY} and optional
#         [[ ... ]] parts. The D_ entries are for the city pages (templates/site_dest.html).
# words:  the sentences the code puts together itself (src/website.py).
# js:     the words the main page's script shows ("words" in templates/site.html).

