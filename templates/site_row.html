<!-- One route in "Të gjitha destinacionet": one line of the price table. On a wide screen the
     parts sit side by side under the table's headings (code, destination, departure, flight,
     saving, price, Rezervo); on a phone the same parts stack into a compact block, with the
     price and Rezervo on the right. A deal gets the OFERTË tag and its price on yellow (those
     parts need DEAL, so they are left out, or stay plain, for other routes).
     Same rules as the post templates: a NAME in curly braces is a value, [[ ... ]] is optional
     and must stay on one line, and a line with a missing value is left out. This comment is
     removed before the page is written.
     Values: everything templates/sq.txt can use, plus IATA, DEAL ("deal", or missing when the
     route isn't one), GUIDE_URL (the city's own page, when it has a guide) and BEST_DATE (the
     cheapest date as YYYY-MM-DD). The page's JavaScript reads the data- attributes to pre-fill
     the search card and to sort and filter the list, and the .city and .book elements. -->
<li class="row[[ {DEAL}]]" data-iata="{IATA}" data-date="{BEST_DATE}" data-price="{PRICE}"[[ data-saving="{SAVING}"]]>
  <span class="code">{IATA}</span>
  <div class="info">
    <div class="where">
      <h3 class="city">{CITY}[[ <span class="airport">{AIRPORT}</span>]]</h3>
      <span class="seal {DEAL}">{T_DEAL_STAMP}</span>
      <div class="links">
        <p class="meta"><a href="{GUIDE_URL}">{T_GUIDE_FOR}</a></p>
        <p class="meta"><a href="{HOTEL_LINK}" target="_blank" rel="noopener sponsored">{T_HOTELS_IN}</a></p>
      </div>
    </div>
    <div class="when">
      <p class="dates"><span class="lbl">{T_DEPARTURE}</span>{DATES}</p>
      <p class="meta">{T_RETURN_FROM}</p>
    </div>
    <div class="flight">
      <p class="meta">{AIRLINE}, {STOPS}[[, {DURATION}]]</p>
    </div>
  </div>
  <div class="fare">
    <p class="saving">-{SAVING}%</p>
    <div class="cost">
      <p class="price"><span class="from">{T_FROM}</span> <span class="amount">€{PRICE}</span></p>
      <p class="way">{T_ONE_WAY_PP}</p>
      <p class="usual">{T_USUALLY}</p>
    </div>
    <a class="book" href="{FLIGHT_LINK}" target="_blank" rel="noopener sponsored">{T_BOOK}</a>
  </div>
</li>
