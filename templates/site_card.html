<!-- One photo card in "Zbulo destinacionet": src/website.py renders it for every route, deals
     first, and puts the result in the page's DEST_CARDS value. The photo is on top, with the
     route's code on it (and the saving, in yellow, on a deal); the city, the price and Rezervo
     are underneath. The whole card is the Rezervo link.
     Same values and rules as site_row.html, plus PHOTO (img/dest/<iata>.webp, or missing when
     there's no photo: the card then has a plain black top), COUNTRY_NAME ("Austri") and
     BEST_DAY (the cheapest date, "14 Nën"). The sticker line needs DEAL and SAVING, so it only
     shows on deals, and so does the round WhatsApp button (WHATSAPP_LINK) over the photo: it
     is a link of its own, beside the card's, since a link can't hold another. This comment is removed before the page is written. -->
<li class="dcard[[ {DEAL}]]" data-iata="{IATA}">
  <a href="{FLIGHT_LINK}" target="_blank" rel="noopener sponsored">
    <span class="dphoto">
      [[<img src="{PHOTO}" alt="" width="600" height="840" loading="lazy" decoding="async">]]
      <span class="dcode">TIA → {IATA}</span>
      <span class="sticker {DEAL}">-{SAVING}%</span>
    </span>
    <span class="dbody">
      <b class="dcity">{CITY}[[, {COUNTRY_NAME}]]</b>
      <span class="dmeta">[[<span class="dair">{AIRPORT}</span> · ]]{T_CARD_META}</span>
      <span class="dfoot">
        <span class="dprice"><small>{T_FROM}</small> €{PRICE}</span>
        <span class="dusual">{T_USUALLY}</span>
        <span class="dgo">{T_BOOK}</span>
      </span>
    </span>
  </a>
  <a class="dshare" href="{WHATSAPP_LINK}" target="_blank" rel="noopener" aria-label="{T_SHARE_WHATSAPP}" title="{T_SHARE_WHATSAPP}"><svg class="ic" aria-hidden="true"><use href="#i-wa"/></svg></a>
</li>
