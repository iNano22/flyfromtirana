# FlyFromTirana on a server (README: "Run it on a server").
#
#   scanner  scans, posts and rebuilds the website every 3 hours (src/scheduler.py)
#   web      serves the generated website (Caddy, set up in web/Caddyfile)
#
# The variables below are filled in by the deploy tool (Coolify lists them
# under Environment Variables) or by a .env file next to this one.

services:
  scanner:
    build: .
    init: true
    restart: unless-stopped
    # A redeploy lets a scan in progress finish (normally a minute or two).
    stop_grace_period: 5m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TRAVELPAYOUTS_TOKEN: ${TRAVELPAYOUTS_TOKEN:?}
      TRAVELPAYOUTS_MARKER: ${TRAVELPAYOUTS_MARKER:?}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:?}
      # Only read when premium.enabled is true in config.yaml.
      TELEGRAM_PREMIUM_CHANNEL_ID: ${TELEGRAM_PREMIUM_CHANNEL_ID:-}
      # Where the bot says so when a scan or the website build fails, and when it works
      # again (README: "Alerts"). Empty = failures are only in the logs.
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:-}
      # Where the Instagram/Facebook posts are reported, or sent as drafts (README:
      # "Instagram and Facebook posts"). Empty = the alert chat.
      TELEGRAM_DRAFTS_CHAT_ID: ${TELEGRAM_DRAFTS_CHAT_ID:-}
      # The Facebook Page's token: with it the bot posts to Instagram and the Page itself.
      META_PAGE_TOKEN: ${META_PAGE_TOKEN:-}
      # The bot that answers Instagram private messages (instagram_dm in config.yaml; README:
      # "Instagram private messages"). It stays off until all three are set, plus META_PAGE_TOKEN.
      META_APP_SECRET: ${META_APP_SECRET:-}       # the Instagram app secret: proves a webhook call is Meta's
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}   # any long random text, typed in the app's webhook settings too
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # Claude writes the replies
    # The Instagram webhook's server; web/Caddyfile passes /meta/webhook to it. Not open to the internet.
    expose:
      - "8080"
    volumes:
      - data:/app/data      # prices.db: price history and what was already posted
      - site:/app/docs      # the generated website

  web:
    # Caddy with web/Caddyfile: the site's files, and its own page for an
    # address that doesn't exist.
    build: ./web
    restart: unless-stopped
    logging: *logging
    # Started after the scanner, which creates the site volume with its own
    # (unprivileged) owner and the page already in it.
    depends_on:
      - scanner
    # Reached by the reverse proxy over the Docker network — no host port.
    expose:
      - "80"
    volumes:
      - site:/srv/site:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
  site:
