  sticker: "24 DESTINACIONE"
  tiles:
    - { photo: FCO, city: Rome }
    - { photo: LHR, city: London }
    - { photo: BCN, city: Barcelona }
    - { photo: IST, city: Istanbul }
    - { photo: VIE, city: Vienna }
    - { photo: ATH, city: Athens }
  title: "24 destinacione"
  caption: |
    24 destinacione, 9 shtete, një aeroport: Rinasi. 🗺️

    🇮🇹 Itali: Milan (Malpensa, Bergamo), Rome (Fiumicino, Ciampino), Bologna, Venice, Naples
    🇬🇷 Greqi: Athens, Thessaloniki
    🇬🇧 Angli: London (Heathrow, Stansted, Luton)
    🇩🇪 Gjermani: Munich, Frankfurt, Stuttgart, Düsseldorf, Berlin
    🇦🇹 Austri: Vienna · 🇨🇭 Zvicër: Zurich
    🇪🇸 Spanjë: Barcelona, Madrid
    🇹🇷 Turqi: Istanbul
    🇧🇪 Belgjikë: Brussels (Zaventem, Charleroi)

    Mungon qyteti yt? Na e shkruaj në komente 👇

    🔔 {TELEGRAM} · 🌐 {WEBSITE}

- card: telegram
  photo: VIE
  kicker: "TELEGRAM  ·  FALAS"
  headline: "Çdo ofertë, në çast"
  pill: "t.me/flyfromtirana"
  members: "kanal publik · falas"
  sample:
    photo: BGY
    time: "08:17"
    lines:
      - "TIRANA → MILAN (Bergamo)"
      - "nga €14 one way"
      - "-35% · zakonisht ~€21"
      - "26 Tet, 28 Tet"
      - "Wizz Air · direkt · 1 orë 55 min"
      - "Kthimi nga €14"
      - "Rezervo tani →"
  title: "Telegram"
  caption: |
    Këtu sheh 2 oferta në ditë. Në Telegram i sheh të gjitha, në çast. 📲

    Kanali ynë në Telegram merr çdo ofertë sapo gjendet, pa pritur postimin e radhës. Çdo mesazh ka datat, kompaninë, kohëzgjatjen, çmimin e kthimit dhe linkun direkt të rezervimit. Hap, kliko, rezervo.

    Është falas dhe pa spam: vetëm oferta.

    👉 {TELEGRAM}

- card: premium
  photo: IST
  kicker: "TELEGRAM  ·  ME ABONIM"
  figure: "6 ORË"
  headline: "Më parë se të gjithë"
  pills: ["ÇDO OFERTË 6 ORË MË PARË", "PRAGU 30%, JO 40%", "KONTROLL ÇDO 15 MIN"]
  text: "Abonim mujor me Telegram Stars. Një biletë e vetme e shlyen."
  sticker: "PREMIUM"
  title: "Premium"
  caption: |
    6 orë. Aq zgjat ndryshimi mes "e bleva" dhe "e humba". ⏳

    Premium është kanali për ata që duan të jenë të parët:
    ⚡ çdo ofertë 6 orë para kanalit falas
    🔎 më shumë oferta: pragu është 30% nën çmimin e zakonshëm, jo 40%
    ⏱️ çmimet kontrollohen çdo 15 minuta dhe postimi është i menjëhershëm

    Një biletë e vetme e shlyen abonimin e muajit.

    Abonimi është mujor, me Telegram Stars: {PREMIUM}

- card: website
  kicker: "FAQJA JONË"
  headline: "flyfromtirana.al"
  sub: "Të gjitha ofertat e sotme, kërkim për çdo datë, udhëzues për çdo qytet. Në shqip, anglisht dhe italisht."
  screenshot: site.png
  title: "flyfromtirana.al"
  caption: |
    Gjithçka në një faqe: flyfromtirana.al 🌐

    ✈️ të gjitha ofertat aktuale nga Tirana, të renditura nga zbritja
    🔎 kërkim fluturimesh për çdo datë
    📍 udhëzues për çdo qytet: çfarë të shohësh, ku të flesh, çfarë të hash
    🇦🇱🇬🇧🇮🇹 në shqip, anglisht dhe italisht

    Përditësohet çdo 3 orë, njësoj si kanali.

    👉 {WEBSITE}

- card: guides
  photo: FCO
  screenshot: guide.png
  figure: "19"
  headline: "Udhëzues qytetesh"
  sub: "Çfarë të shohësh, plani për 3 ditë, ku të flesh, çfarë të hash, si arrin nga aeroporti."
  title: "19 udhëzues"
  caption: |
    Bileta e lirë është gjysma e punës. Tjetrën e kemi shkruar ne. 📍

    Për çdo destinacion kemi një udhëzues të plotë: vendet që duhen parë, një plan për 3 ditë, lagjet ku të flesh, pjatat që duhen provuar, si arrin nga aeroporti në qendër dhe sa kushtojnë gjërat. Plus dokumentet që të duhen për të hyrë në çdo shtet si qytetar shqiptar.

    I gjen te {WEBSITE}. Dhe çdo javë postojmë një prej tyre edhe këtu, me të gjitha kartat.

    🔔 {TELEGRAM}

- card: follow
  photo: LHR
  headline: "Ndiqna"
  pills: ["2 OFERTA NË DITË", "TOP 5 ÇDO TË DIEL", "1 UDHËZUES ÇDO JAVË"]
  sub: "Aktivizo njoftimet, që oferta të mos të ikë."
  title: "Ndiqna"
  caption: |
    Ndiqna dhe aktivizo njoftimet. Ofertat e mira nuk presin. 🔔

    Që të mos humbasësh asnjë:
    1. ndiq @flyfromtirana këtu dhe në Facebook
    2. aktivizo njoftimet e postimeve (zilja lart djathtas)
    3. hyr në Telegram: {TELEGRAM}

    Çfarë vjen:
    📸 2 ofertat më të mira çdo ditë
    🏆 TOP 5 e javës, çdo të diel
    📍 një udhëzues qyteti çdo javë

    Ndaje me dikë që do të udhëtojë ✈️
