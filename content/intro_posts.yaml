# The nine posts that open the Instagram and Facebook accounts (scripts/intro_posts.py).
# They are posted in this order, so number 9 ends up top-left of the Instagram grid.
#
# `card` names the picture's drawer in src/intro_cards.py; the other keys are what the
# drawer shows (photos are airport codes: assets/telegram/<code>.jpg). In the captions,
# {TELEGRAM}, {WEBSITE} and {PREMIUM} become "@flyfromtirana", "flyfromtirana.al (linku
# në bio)" and a Premium line on Instagram, and clickable links on Facebook. The
# hashtags from config.yaml are added at the end. No emoji on the cards (the fonts
# have none); in the captions as many as you like.

- card: hook
  photo: VCE
  kicker: "NGA TIRANA  ·  ONE WAY"
  price: "€13"
  city: Venice
  line: "17 Nëntor  ·  Ryanair, direkt  ·  oferta e vërtetë"
  sticker: "GJETUR KËTË JAVË"
  title: "Venice për €13"
  caption: |
    Venice për €13? Po. Dhe e gjetëm ne, jo ti. 🛫

    Jemi FlyFromTirana: gjejmë fluturimet më të lira nga Tirana (Rinas) drejt 24 qyteteve të Europës dhe i postojmë çdo ditë. Pa reklama të mërzitshme, pa "çmime nga" që nuk ekzistojnë: vetëm oferta reale, me datat dhe linkun.

    Çfarë do të gjesh këtu:
    📸 2 ofertat më të mira të ditës
    🏆 TOP 5 e javës, çdo të diel
    📍 udhëzues për çdo qytet

    🔔 Ofertat dalin të parat në Telegram: {TELEGRAM}
    🌐 Të gjitha ofertat: {WEBSITE}

- card: prices
  photo: MXP
  kicker: "OFERTA REALE  ·  ONE WAY"
  title: "Këtë javë gjetëm:"
  tiles:
    - { photo: MXP, city: Milan, price: "€15" }
    - { photo: FCO, city: Rome, price: "€17" }
    - { photo: STN, city: London, price: "€16" }
    - { photo: VIE, city: Vienna, price: "€20" }
  caption: |
    Milan €15. Rome €17. London €16. Vienna €20. 🤯

    Jo "çmime nga" të fryra: këto janë oferta që i gjetëm dhe i postuam këtë javë, one way nga Tirana, me datat e sakta dhe linkun e rezervimit.

    Sekreti? Çmimet e lira zgjasin pak orë. Ne i kontrollojmë çdo 3 orë dhe të lajmërojmë sapo dalin. Ti vetëm duhet të jesh gati. ✈️

    🔔 I merr i pari në Telegram: {TELEGRAM}
    🌐 Të gjitha ofertat e sotme: {WEBSITE}

- card: stats
  photo: BCN
  kicker: "SI FUNKSIONON"
  sticker: "ROBOTI NUK FLE"
  rows:
    - { figure: "ÇDO 3 ORË", text: "kontrollojmë çmimet për 24 destinacione, 60 ditë përpara" }
    - { figure: "30 DITË", text: "historik çmimesh për çdo linjë: dimë sa kushton zakonisht" }
    - { figure: "-40%", text: "nën çmimin e zakonshëm = ofertë. Ndryshe, heshtim." }
  title: "Si i gjejmë ofertat"
  caption: |
    Si i gjejmë ofertat? Me një robot që nuk fle. 🤖

    ⏱️ Çdo 3 orë kontrollon çmimet e fluturimeve nga Tirana për 24 destinacione, 60 ditë përpara, në të dy drejtimet.
    📊 Për çdo linjë mban historikun e 30 ditëve: e di sa kushton "zakonisht" një biletë.
    🔥 Kur çmimi bie të paktën 40% nën të zakonshmin (ose nën pragun e linjës), e poston. Ndryshe hesht.

    Rezultati: jo "oferta" çdo ditë për çdo gjë. Vetëm ato që ia vlejnë, me datat dhe linkun direkt.

    Si rezervon: hap linkun (në Telegram është në mesazh; këtu: linku në bio → faqja), zgjidh fluturimin dhe rezervo te kompania. Çmimet janë one way me bagazh dore; kthimin e tregojmë veç.

    🔔 {TELEGRAM} · 🌐 {WEBSITE}

