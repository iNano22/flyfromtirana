gb: >-
  Il Regno Unito non fa parte dell'area Schengen. Ai cittadini albanesi serve un visto per
  visitatori (Standard Visitor visa), che si richiede online e prevede un appuntamento per i dati
  biometrici. Fai domanda con qualche settimana di anticipo e non comprare il biglietto prima di
  aver ottenuto il visto.
tr: >-
  I cittadini albanesi entrano in Turchia senza visto, per soggiorni fino a 90 giorni. Basta il
  passaporto, che è consigliabile sia valido per almeno 6 mesi dopo la data di ingresso.
