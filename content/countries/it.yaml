ie: >-
  L'Irlanda non fa parte dell'area Schengen e non accetta i visti Schengen o britannici. Ai
  cittadini albanesi serve un visto irlandese (short stay visa), che si richiede online prima di
  inviare i documenti. Fai domanda con almeno 8 settimane di anticipo e non comprare il biglietto
  prima di aver ottenuto il visto.
ae: >-
  Da aprile 2023 i cittadini albanesi con passaporto ordinario entrano negli Emirati Arabi Uniti
  senza visto preventivo: il timbro d'ingresso viene dato in aeroporto. Il passaporto deve essere
  valido per almeno 6 mesi. Le regole cambiano: prima di partire verifica con l'ambasciata o con
  la compagnia aerea.
rs: >-
  La Serbia non fa parte dell'area Schengen. I cittadini albanesi entrano senza visto, per
  soggiorni fino a 90 giorni ogni 180 giorni, e basta anche la carta d'identità al posto del
  passaporto.
il: >-
  I cittadini albanesi con passaporto ordinario entrano in Israele senza visto, per soggiorni fino
  a 90 giorni, ma dal 1 gennaio 2025 devono ottenere prima di partire l'autorizzazione elettronica
  ETA-IL (circa 25 shekel, valida 2 anni). Il passaporto deve essere valido per almeno 6 mesi.
  Prima di prenotare controlla anche gli avvisi di viaggio.
