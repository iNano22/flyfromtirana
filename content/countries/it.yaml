# What an Albanian citizen needs to enter each country we fly to, in Italian.
# Same country codes as sq.yaml. Shown on every city page of that country.
it: >-
  L'Italia fa parte dell'area Schengen. I cittadini albanesi con passaporto biometrico entrano
  senza visto, per soggiorni fino a 90 giorni ogni 180 giorni. Il passaporto deve essere valido
  per almeno 3 mesi dopo la data di rientro. Alla frontiera vengono registrati i dati biometrici
  (sistema EES), mentre è previsto che l'autorizzazione online ETIAS diventi obbligatoria: prima
  di partire controlla se è entrata in vigore.
