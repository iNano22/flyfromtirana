ie: >-
  Ireland is not in the Schengen area and does not accept Schengen or UK visas. Albanian citizens
  need an Irish visa (short stay visa), which you apply for online before sending in your
  documents. Apply at least 8 weeks ahead and don't buy your ticket until you have the visa.
ae: >-
  Since April 2023 Albanian citizens with an ordinary passport enter the United Arab Emirates
  without a visa in advance: the entry stamp is given at the airport. Your passport must be valid
  for at least 6 months. The rules change: check with the embassy or the airline before you leave.
rs: >-
  Serbia is not in the Schengen area. Albanian citizens enter without a visa, for stays of up to
  90 days in any 180-day period, and an identity card is enough instead of a passport.
il: >-
  Albanian citizens with an ordinary passport enter Israel without a visa, for stays of up to 90
  days, but since 1 January 2025 they must get the ETA-IL electronic travel authorisation before
  leaving (about 25 shekels, valid for 2 years). Your passport must be valid for at least 6
  months. Check the travel advice too before you book.
