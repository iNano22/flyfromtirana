# What an Albanian citizen needs to enter each country we fly to, in English.
# Same country codes as sq.yaml. Shown on every city page of that country.
it: >-
  Italy is in the Schengen area. Albanian citizens with a biometric passport enter without a visa,
  for stays of up to 90 days in any 180-day period. Your passport must be valid for at least 3
  months after your return date. Biometric data is recorded at the border (the EES system), and the
  ETIAS online authorisation is expected to become mandatory: check before you leave whether it has
  come into force.
