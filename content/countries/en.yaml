gb: >-
  The United Kingdom is not in the Schengen area. Albanian citizens need a visitor visa (Standard
  Visitor visa), which you apply for online and which requires an appointment to give your
  biometric data. Apply several weeks ahead and don't buy your ticket until you have the visa.
tr: >-
  Albanian citizens enter Turkey without a visa, for stays of up to 90 days. All you need is your
  passport, which should ideally be valid for at least 6 months after your date of entry.
