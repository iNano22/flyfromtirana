ie: >-
  Ireland is not in the Schengen area and does not accept Schengen or UK visas. Albanian citizens
  need an Irish visa (short stay visa), which you apply for online before sending in your
  documents. Apply at least 8 weeks ahead and don't buy your ticket until you have the visa.
ae: >-
  Since April 2023 Albanian citizens with an ordinary passport enter the United Arab Emirates
  without a visa in advance: the entry stamp is given at the airport. Your passport must be valid
  for at least 6 months. The rules change: check with the embassy or the airline before you leave.
rs: >-
  Serbia is not in the Schengen area. Albanian citizens enter without a visa, for stays of up to
  90 days in any 180-day period, and an identity card is enough instead of a passport.
il: >-
  Albanian citizens with an ordinary passport enter Israel without a visa, for stays of up to 90
  days, but since 1 January 2025 they must get the ETA-IL electronic travel authorisation before
  leaving (about 25 shekels, valid for 2 years). Your passport must be valid for at least 6
  months. Check the travel advice too before you book.
pt: >-
  Portugal is in the Schengen area. Albanian citizens with a biometric passport enter without a
  visa, for stays of up to 90 days in any 180-day period. Your passport must be valid for at least
  3 months after your return date. Biometric data is recorded at the border (the EES system), and
  the ETIAS online authorisation is expected to become mandatory: check before you leave whether
  it has come into force.
md: >-
  Moldova is not in the EU. Albanian citizens enter without a visa, for stays of up to 90 days in
  any 180-day period, but you need a passport: an identity card is not enough.
jo: >-
  Albanian citizens need a visa for Jordan, but it is issued at the airport on arrival or online
  (e-Visa) before you leave. The Jordan Pass, which also includes entry to Petra, waives the visa
  fee under certain conditions. Your passport must be valid for at least 6 months; check the rules
  before you travel.
eg: >-
  Albanian citizens need a visa for Egypt. For tourism it is issued at the airport on arrival (30
  days) or online (e-Visa) before you leave. Your passport must be valid for at least 6 months;
  check the rules before you travel.
sa: >-
  Albanian citizens need a tourist visa for Saudi Arabia, issued online (eVisa) before you leave
  or on arrival. Your passport must be valid for at least 6 months. Respect the local rules on
  dress and behaviour, and check the conditions before you travel.
am: >-
  Albanian citizens enter Armenia without a visa, for stays of up to 180 days a year, with a valid
  passport.
ca: >-
  Albanian citizens need a visitor visa for Canada (temporary resident visa), which you apply for
  online and which requires giving biometric data; the simpler eTA is not available to them. Apply
  several months ahead and don't buy your ticket until you have the visa.
