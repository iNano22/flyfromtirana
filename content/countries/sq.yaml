# What an Albanian citizen needs to enter each country we fly to, keyed by the
# country's two-letter code (the one behind a route's flag in config.yaml).
# Shown on every city page of that country, under "Çfarë dokumentesh duhen?".
# These rules change: review them a couple of times a year (ETIAS above all).
it: >-
  Italia është në zonën Shengen. Shtetasit shqiptarë me pasaportë biometrike hyjnë pa vizë, për
  qëndrime deri në 90 ditë brenda çdo 180 ditëve. Pasaporta duhet të jetë e vlefshme të paktën
  3 muaj pas datës së kthimit. Në kufi regjistrohen të dhënat biometrike (sistemi EES), ndërsa
  autorizimi online ETIAS pritet të bëhet i detyrueshëm: kontrollo para nisjes nëse ka hyrë në fuqi.
