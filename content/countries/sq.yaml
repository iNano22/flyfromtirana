ie: >-
  Irlanda nuk është në zonën Shengen dhe nuk pranon vizat Shengen apo britanike. Shtetasve
  shqiptarë u duhet vizë irlandeze (short stay visa), që aplikohet online dhe pastaj dorëzohen
  dokumentet. Apliko të paktën 8 javë përpara dhe mos e bli biletën pa e marrë vizën.
ae: >-
  Që nga prilli 2023 shtetasit shqiptarë me pasaportë të zakonshme hyjnë në Emiratet e Bashkuara
  Arabe pa vizë paraprake: vula jepet në aeroport. Pasaporta duhet të jetë e vlefshme të paktën 6
  muaj. Rregullat ndryshojnë: kontrollo para nisjes te ambasada ose te linja ajrore.
rs: >-
  Serbia nuk është në zonën Shengen. Shtetasit shqiptarë hyjnë pa vizë, për qëndrime deri në 90
  ditë brenda çdo 180 ditëve, dhe mjafton edhe karta e identitetit në vend të pasaportës.
il: >-
  Shtetasit shqiptarë me pasaportë të zakonshme hyjnë në Izrael pa vizë, për qëndrime deri në 90
  ditë, por që nga 1 janari 2025 duhet të marrin para nisjes autorizimin elektronik ETA-IL (rreth
  25 shekel, i vlefshëm 2 vjet). Pasaporta duhet të jetë e vlefshme të paktën 6 muaj. Kontrollo
  edhe këshillat e udhëtimit para se të rezervosh.
