city: Marseille
slug: marseille
tagline: Old port, Calanques and bouillabaisse
intro: >-
  Marseille is the second city of France and its oldest port, founded by the Greeks about 2600 years
  ago. It is a noisy, multicultural city, with a blue sea and white cliffs. Two or three days are
  enough for the port, Le Panier, the basilica on the hill and a day in the Calanques.
sights:
  - name: Vieux-Port
    text: The old port, the heart of the city, with boats, cafés and two forts at its entrance. Every morning fishermen sell the catch of the day on the Quai des Belges.
  - name: Notre-Dame de la Garde
    text: The basilica at the top of the hill, about 150 metres above the sea, with the golden statue of the Virgin that locals call the «Bonne Mère». Entry is free and the view over the city is stunning. Go up by bus 60 from the Vieux-Port or on foot, about 30-40 minutes.
  - name: Le Panier
    text: The oldest quarter, with narrow lanes, colourful houses and murals. In the middle of it is the Vieille Charité, a former almshouse for the poor.
  - name: MuCEM and Fort Saint-Jean
    text: The museum of Mediterranean civilisations, in a cube with walls like concrete lace, linked by a footbridge to Fort Saint-Jean. The fort and the gardens are free; exhibitions cost about €11-13.
  - name: Calanques
    text: Narrow coves with white cliffs and blue water between Marseille and Cassis, a national park. For Sugiton take bus B1 to Luminy, then walk for about 1 hour. Boats from the Vieux-Port run tours from about €30-45.
  - name: Corniche Kennedy and Vallon des Auffes
    text: The panoramic seafront road south of the centre, with small beaches and the Vallon des Auffes, a tiny fishing harbour.
airports:
  MRS: >-
    Marseille Provence airport is in Marignane, about 27 km from the city. The shuttle bus (navette)
    takes you to Saint-Charles station in about 25-30 minutes; it runs every 15-20 minutes and costs
    about €10. Cheaper: a free shuttle takes you in 5 minutes to Vitrolles Aéroport station, from
    where the TER train reaches Saint-Charles in about 20 minutes, for about €5-6, but it does not
    run often. A taxi costs about €60-75.
budget: >-
  A coffee at the counter costs about €1.50-2.50, a pizza €10-14, a dish of the day €13-18, a metro
  ticket about €2. A hostel bed costs from about €25-40, a double room in a simple hotel from about
  €70-110 a night.
when: >-
  May to June and September to October are the best time: warm weather, a sea for swimming and fewer
  tourists. July and August are hot, and on days of fire risk the Calanques are closed. Winter is
  mild, but the mistral wind can blow hard.
tips:
  - "From June to September the Calanques may close when the fire risk is high: check the park's official website the day before. For Sugiton in summer, book the free entry online."
  - "For the Calanques take good shoes and at least 1.5 litres of water per person: there are no shops inside."
  - "Watch your phone and wallet at the Vieux-Port and on the metro. At night avoid the side streets around Saint-Charles and Noailles."
itinerary:
  - "The Vieux-Port with its fish market in the morning, then Le Panier and the Vieille Charité. In the afternoon, the MuCEM and Fort Saint-Jean, until sunset."
  - "A day in the Calanques: bus B1 to Luminy and a walk to Sugiton, with a swim and a picnic. Otherwise, a boat tour. In the evening, dinner around Cours Julien."
  - "Notre-Dame de la Garde in the morning, then walk down to the Vallon des Auffes and the Corniche Kennedy. In the afternoon, the boat to the Frioul islands."
areas:
  - name: Vieux-Port
    text: In the centre, with everything within walking distance and the boats nearby. Mid-range to high prices.
  - name: Le Panier
    text: A neighbourhood with atmosphere and small hotels, but with lots of steps for suitcases.
  - name: Cours Julien
    text: The alternative neighbourhood, with murals, bars and cheap restaurants, about 15 minutes' walk from the port.
  - name: Saint-Charles
    text: "The most practical area for the airport: the bus and the trains leave from the station. Cheaper hotels, but the streets around it are not pleasant at night."
food:
  - name: Bouillabaisse
    text: The fishermen's soup, the city's most famous dish, with fish broth, toasted bread with rouille sauce and several kinds of fish. A proper one costs about €60-80 per person; cheap versions are rarely good.
  - name: Panisse
    text: Fried strips of chickpea flour, simple street food.
  - name: Navettes
    text: Boat-shaped biscuits flavoured with orange blossom, from the Four des Navettes bakery, opened in 1781.
  - name: Pastis
    text: An aniseed drink mixed with cold water as an aperitif, in the cafés around the port.
transport: >-
  The centre is walkable, and the RTM network has 2 metro lines, 3 tram lines and buses. A single
  ticket costs about €2 and is valid for 1 hour with transfers; a 24-hour ticket about €5-6. The
  little Ferry Boat crosses the port from one side to the other.
daytrips:
  - name: Cassis
    text: A small fishing port with colourful houses, where the boats leave for the most beautiful coves. About 45 minutes by bus; the train takes about 20 minutes, but the station is about 3 km from the port.
  - name: Aix-en-Provence
    text: Cézanne's elegant town, with fountains, markets and the Cours Mirabeau boulevard. The bus from Saint-Charles takes about 30-40 minutes.
  - name: Frioul islands
    text: Rocky islands with small beaches, about 20-30 minutes by boat from the Vieux-Port, with a stop at the Château d'If, the prison of «The Count of Monte Cristo». The return boat costs about €11-17.
faq:
  - q: "Bus or train from the airport?"
    a: "The direct bus to Saint-Charles is simpler: about 25-30 minutes and about €10. The train from Vitrolles costs about €5-6, but you have to change and wait. For 3-4 people with suitcases, a taxi is reasonable."
  - q: "How much money do you need per day in Marseille?"
    a: "Excluding the flight and accommodation, allow €45-75 a day. You save with pizza, panisse and a picnic in the Calanques."
