city: Yerevan
slug: yerevan
tagline: The Cascade, Armenian brandy and views of Mount Ararat
intro: >-
  Yerevan is the capital of Armenia, a city built of pink volcanic stone, with Mount Ararat on the
  horizon on clear days. It is cheap and lively until late in the evening. The currency is the
  Armenian dram (AMD): €1 is about 450 dram. Three or four days are enough for the city and two
  trips outside it. Direct flights from Tirana are seasonal, so check the dates when the route runs.
sights:
  - name: The Cascade
    text: >-
      A huge stone staircase with gardens and modern sculptures. Inside there are free escalators;
      from the top you see all of Yerevan and, in the morning, Mount Ararat.
  - name: Republic Square and the singing fountains
    text: >-
      The main square, with buildings of pink stone. On evenings in the warm season, usually from May
      to October, the fountains dance to music and lights, for free.
  - name: Matenadaran
    text: >-
      The museum of ancient manuscripts, with hand-illustrated books. A ticket costs about 2500 dram
      (about €5.5); an audio guide is worth it.
  - name: Genocide Memorial (Tsitsernakaberd)
    text: >-
      The memorial to the victims of 1915, on a hill overlooking the city, with the eternal flame and
      a museum. Entry is free.
  - name: Vernissage market
    text: >-
      An open-air market with paintings, carpets, woodwork, silver and souvenirs. It is biggest at the
      weekend; haggling over the price is normal.
  - name: Ararat brandy factory
    text: >-
      The historic Armenian brandy factory, near the bridge over the Hrazdan river. Tours with tasting
      last about 1 hour and start from about 7000 dram (about €15.5); book ahead.
itinerary:
  - "Republic Square and Northern Avenue in the morning, then the Opera and the Cascade to the top. In the afternoon the Matenadaran, in the evening the singing fountains and a khorovats dinner."
  - "The Genocide Memorial in the morning, then a tasting tour at the brandy factory. In the afternoon the Vernissage market, in the evening a café around the Opera."
  - "A day outside the city: the temple of Garni and the Geghard monastery. Alternatively, Khor Virap in the morning for the view of Ararat and Etchmiadzin in the afternoon."
areas:
  - name: Kentron
    text: "The centre around Republic Square and Northern Avenue: everything within walking distance, with most of the hotels and restaurants."
  - name: Around the Cascade and the Opera
    text: The most pleasant part of the centre, with cafés and wine bars, a little more expensive.
  - name: Arabkir
    text: A quieter residential area north of the Cascade, with well-priced apartments, 15-25 minutes on foot from the centre.
food:
  - name: Khorovats
    text: >-
      Meat grilled on skewers over embers, usually pork, lamb or chicken, with grilled vegetables.
  - name: Dolma
    text: Vine or cabbage leaves stuffed with meat and rice, served with garlic yoghurt.
  - name: Lavash
    text: >-
      The thin Armenian bread, baked in a clay oven (tonir), that comes with every meal.
  - name: Armenian brandy
    text: >-
      The country's most famous drink, sipped slowly after dinner. A glass in a bar costs about
      1500-3000 dram (about €3.5-6.5).
airports:
  EVN: >-
    Zvartnots International Airport is about 12 km west of the centre. Bus or minibus 201 takes you
    to the centre in about 30-40 minutes, with a ticket of about 300 dram (about €0.7); it leaves
    roughly every 30 minutes during the day. With the Yandex Go or GG apps the ride to the centre
    costs about 3000-4000 dram (about €7-9) and takes about 20 minutes.
transport: >-
  The centre is easy to walk. There is one metro line and many buses and minibuses, with a ticket of
  about 300 dram (about €0.7) per ride; on many of them you pay with a contactless bank card. App
  taxis, Yandex Go or GG, are very cheap: a ride within the city costs about 1000-2000 dram (about
  €2-4.5).
daytrips:
  - name: Garni and Geghard
    text: >-
      Garni is the country's only Greco-Roman temple, from the 1st century, about 30 km east, above a
      gorge with basalt columns. About 10 km further on is Geghard, a monastery partly carved into the
      rock. Go by taxi or with a group tour.
  - name: Khor Virap
    text: >-
      A monastery on a small hill about 45 km south, about 1 hour by car, with the closest view of
      Mount Ararat. Go in the morning, when the sky is clearest.
  - name: Lake Sevan
    text: >-
      The large mountain lake about 65 km north-east, about 1 hour by car, with the Sevanavank
      monastery on a peninsula. In summer there are beaches, but the water stays cold.
  - name: Etchmiadzin
    text: >-
      The centre of the Armenian Church, with its ancient cathedral, about 20 km west. Minibuses from
      the centre take about 30-40 minutes; on the way, stop at the ruins of Zvartnots cathedral.
budget: >-
  A coffee costs about 800-1200 dram (about €2-2.5), a shawarma or lahmajo about 1000-1500 dram
  (about €2-3.5), a dinner at a restaurant about 5000-8000 dram (about €11-18). Excluding the flight
  and accommodation, count on €30-45 a day. A hostel bed starts from about €10-15, a double room in
  a simple hotel about €35-60.
when: >-
  May-June and September-October have the best weather. July and August are very hot, often above
  35 degrees. Winter is cold, with snow.
tips:
  - "Pay in dram. Cards are accepted almost everywhere in the centre, but markets and some minibuses need cash."
  - "Many signs are also in English; many people speak Russian and young people speak English."
  - "The water from the small street fountains (pulpulak) is drinkable and cool."
faq:
  - q: "How do I get from the airport to the centre?"
    a: "Bus or minibus 201 costs about 300 dram and takes about 30-40 minutes. With Yandex Go or GG it costs about 3000-4000 dram to the centre."
  - q: "How much money do I need per day in Yerevan?"
    a: "Excluding the flight and accommodation, about €30-45 a day. A taxi for the whole day to Garni and Geghard costs about 15000-20000 dram (about €33-45) for the whole car."
