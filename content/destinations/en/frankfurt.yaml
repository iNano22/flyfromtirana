city: Frankfurt
slug: frankfurt
tagline: Skyscrapers on the River Main
intro: >-
  Frankfurt is Germany's financial centre, with skyscrapers along the River Main and a rebuilt old
  town. One or two days are enough, and it's a good hub for travelling on by train across Germany.
sights:
  - name: Römerberg
    text: The historic square with its half-timbered houses and the old town hall.
  - name: Main Tower
    text: The skyscraper with a viewing platform 200 metres up.
  - name: Museumsufer
    text: The museum embankment along the River Main, with the Städel Museum the best known.
  - name: Sachsenhausen
    text: The district of traditional taverns serving Apfelwein, apple wine.
  - name: The Cathedral
    text: The church where German emperors were crowned, with a tower you can climb for the view.
  - name: Kleinmarkthalle
    text: The covered market with food from all over the world, much loved by locals.
airports:
  FRA: >-
    The S8 and S9 trains reach the main station (Hauptbahnhof) in 11-15 minutes, and the ticket
    costs about €6. The station is inside Terminal 1.
budget: >-
  A glass of Apfelwein costs €3-4, a traditional dish €12-18, and a single ticket in the city about
  €4.
when: >-
  May to September. In December the Christmas market on the Römerberg is one of the prettiest in
  Germany.
tips:
  - "During the big trade fairs, such as the Book Fair in October, hotels get much more expensive."
  - "Heidelberg and Mainz can be reached in under an hour by train."
  - "On some Saturdays the riverbank on the museum side turns into a big market of antiques and second-hand goods."
itinerary:
  - "The Römerberg, the Cathedral and the rebuilt old town. Lunch at the Kleinmarkthalle, then go up the Main Tower in the afternoon and walk along the river."
  - "The museum embankment: the Städel for art, or one of the other museums. In the afternoon, the Palmengarten botanical garden, then the evening over Apfelwein in Sachsenhausen."
  - "A day trip: Heidelberg, Mainz or the Rhine Valley with its castles."
areas:
  - name: Innenstadt and Altstadt
    text: "Between the Zeil shopping street, the Römerberg and the river: central and pleasant."
  - name: Bahnhofsviertel
    text: Next to the main station, with cheap hotels and restaurants from all over the world, but noisy at night.
  - name: Sachsenhausen
    text: "On the other side of the river: traditional taverns and a neighbourhood feel."
food:
  - name: Apfelwein
    text: Tart apple wine, served in grey jugs with blue flowers.
  - name: Grüne Soße
    text: A cold sauce of seven herbs, with boiled eggs and potatoes.
  - name: Frankfurter Würstchen
    text: The thin sausages that gave the “frankfurter” its name.
  - name: Handkäse mit Musik
    text: A strong cheese marinated with onion and vinegar, for the brave.
transport: >-
  The centre is compact and walkable. For the rest there are the U-Bahn, the S-Bahn and trams; from
  the airport to the centre it's only 11-15 minutes. The main station is one of the biggest rail
  hubs in Europe, with high-speed trains to all of Germany.
daytrips:
  - name: Heidelberg
    text: The castle above the River Neckar and the old university town, about an hour by train.
  - name: Mainz and Wiesbaden
    text: Two cities on the Rhine, 35-40 minutes by S-Bahn.
  - name: Rhine Valley
    text: Rüdesheim and the castles among the vineyards, about an hour by train.
faq:
  - q: "Is Frankfurt worth a visit, or is it just for transit?"
    a: "One full day is enough for the centre and the museum embankment. Its real value is as a base: by train you can quickly reach Heidelberg, Mainz, Cologne or Stuttgart."
  - q: "How much money do you need per day in Frankfurt?"
    a: "Excluding the flight and accommodation, plan on €50-75 a day. Hotels are cheaper at weekends and get much more expensive during trade fairs."
