city: Alghero
slug: alghero
tagline: Catalan bastions, sea caves and clear beaches
intro: >-
  Alghero is the most beautiful town on the north-west coast of Sardinia: an old town with walls and
  bastions above the sea, cobbled lanes and sunsets over Capo Caccia. After 1354 it was settled by
  Catalans, which is why it is called the «Barceloneta» of Sardinia, and some locals still speak a
  Catalan dialect. Three or four days are enough, ideally with a rental car for the days out of town.
sights:
  - name: The old town and its bastions
    text: The centre inside the walls, with the Porta Terra, Sulis and Maddalena towers. The Bastioni Cristoforo Colombo and Bastioni Marco Polo are the place for an evening walk by the sea.
  - name: The Catalan heritage
    text: Street signs are in Italian and Catalan (Alghero is «L'Alguer»). The Cathedral of Santa Maria, the church of San Francesco and the coloured-tile dome of San Michele show off the Catalan Gothic style.
  - name: Grotta di Nettuno
    text: Neptune's Grotto, with stalactites and an underground lake, beneath the cliffs of Capo Caccia. You get there by boat from the harbour or on foot from above, down the Escala del Cabirol with its 654 steps. The ticket costs about €16-18.
  - name: Capo Caccia
    text: The headland of sheer cliffs about 24 km west of town, above the bay of Porto Conte. The viewpoint near the lighthouse is ideal at sunset.
  - name: Le Bombarde and Lazzaretto
    text: "Two small beaches with white sand and clear water, about 10 km west, past Fertilia. In summer they fill up quickly: go early."
airports:
  AHO: >-
    Alghero-Fertilia airport is about 10 km north of town. ARST buses leave from in front of the
    terminal roughly every hour, more often in summer, and reach the centre in about 20-30 minutes;
    the ticket costs about €2. There are also buses to Sassari (about 30-40 minutes) and, with
    Logudoro Tours, to other towns. A taxi costs about €25-30 and takes about 15 minutes. The
    terminal has plenty of car rental desks.
budget: >-
  An espresso at the bar costs about €1.20-1.50, a pizza €8-12 and a fish dinner about €30-40. In
  summer a double room in a B&B costs from about €80-130 a night, less in May or October. A rental
  car costs from about €30-50 a day in season.
when: >-
  Flights from Tirana are seasonal, mainly in summer: check the schedules. June and September are the
  best time, with a warm sea and fewer people. July and August are hot, crowded and more expensive.
  Out of season many places close and the buses to the beaches become rare.
tips:
  - "Boats to the Grotta di Nettuno don't sail when the sea is rough: then go to Capo Caccia by bus or car and walk down the steps."
  - "In season La Pelosa needs a booking and an entry fee of about €3.50: book a few days ahead."
itinerary:
  - "The old town: the Cathedral of Santa Maria, San Francesco and San Michele. In the afternoon, the San Giovanni beach; in the evening, sunset over the Bastioni Marco Polo."
  - "The Grotta di Nettuno by boat from the harbour or by bus to Capo Caccia. On the way back, a stop at the Nuraghe di Palmavera and in Porto Conte."
  - "A beach day at Le Bombarde or Lazzaretto, then an aperitivo in Fertilia."
  - "By car, Stintino and La Pelosa beach, or the coast road to Bosa."
areas:
  - name: Centro storico
    text: "Inside the walls: everything within walking distance, with B&Bs in old houses, but in summer the lanes are noisy until late."
  - name: Lungomare and Lido
    text: Along the coast north of the centre, with hotels and apartments near the beach, about 10-15 minutes on foot from the old town.
  - name: Fertilia
    text: A quiet village near the airport and the Le Bombarde and Lazzaretto beaches, good if you have a car.
food:
  - name: Aragosta alla catalana
    text: Boiled lobster, served cold with tomato, fresh onion, olive oil and lemon. It is priced by weight, so ask the price before you order.
  - name: Seadas
    text: The typical Sardinian dessert, a pastry filled with pecorino cheese, fried and covered in honey.
  - name: Sardinian wines
    text: White Vermentino and red Cannonau are the island's best-known wines. Near town they also make Torbato, a white you rarely find anywhere else.
transport: >-
  The old town and the lungomare are easy on foot, and by bike you can ride along the coast to
  Fertilia. ARST buses reach the beaches and Capo Caccia, but they make few trips a day. For
  Stintino, Bosa and Castelsardo a rental car is the easiest option.
daytrips:
  - name: Stintino and La Pelosa
    text: One of the most beautiful beaches in Italy, with shallow turquoise water facing the Torre della Pelosa tower. About 1 hour by car; in season the number of visitors is limited.
  - name: Bosa
    text: A town of coloured houses on the river Temo, below the Malaspina castle. The coast road from Alghero, about 1 hour by car, is one of the most beautiful on the island.
  - name: Nuraghe di Palmavera
    text: A Bronze Age nuraghic complex, with a stone tower and about 50 huts, about 10 km west, on the road to Capo Caccia. Ticket about €6.
  - name: Castelsardo
    text: A medieval village on a rock by the sea, with the Doria castle and hand-woven baskets. About 1 hour by car.
faq:
  - q: "Do I need a rental car in Alghero?"
    a: "Not for the town: you can see it on foot and the bus takes you from the airport. For La Pelosa, Bosa and Castelsardo, yes, because buses are rare and often go via Sassari."
  - q: "How much money do you need per day in Alghero?"
    a: "Excluding the flight and accommodation, plan on €50-70 a day, more with a car or the boat to the Grotta di Nettuno. A lobster dinner can cost as much as the whole day."
