gb: >-
  Mbretëria e Bashkuar nuk është në zonën Shengen. Shtetasve shqiptarë u duhet vizë vizitori
  (Standard Visitor visa), që aplikohet online dhe kërkon një takim për të dhënat biometrike.
  Apliko disa javë përpara dhe mos e bli biletën pa e marrë vizën.
tr: >-
  Shtetasit shqiptarë hyjnë në Turqi pa vizë, për qëndrime deri në 90 ditë. Mjafton pasaporta,
  që këshillohet të jetë e vlefshme të paktën 6 muaj pas datës së hyrjes.
