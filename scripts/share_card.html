<!doctype html>
<!-- The picture a link to the site shows on Telegram, WhatsApp or Facebook: this small page,
     photographed at 1200 x 630 by scripts/share_card.py, which also fills in the NAMES in curly
     braces (LANG BRAND KICKER HEADLINE_A HEADLINE_B ADDRESS ORIGIN ROWS). It is drawn like the
     top of the site: the colours and the two typefaces are the ones in templates/site.html. -->
<html lang="{LANG}">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
:root { --ink: #0f1114; --sun: #ffd60a; --board-line: #2a2e35; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 56px; padding: 56px 64px; background: var(--sun); color: var(--ink); font-family: "Archivo", system-ui, sans-serif; }

/* Left: the brand, the headline, the address */
.text { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.brand { display: flex; align-items: center; gap: 16px; font-weight: 800; font-stretch: 88%; font-size: 38px; letter-spacing: -0.01em; }
.mark { width: 60px; height: 60px; border-radius: 10px; background: var(--ink); color: var(--sun); display: grid; place-items: center; }
.mark svg { width: 36px; height: 36px; fill: currentColor; }
.kicker { display: inline-block; margin: 0 0 22px; padding: 10px 16px; border-radius: 8px; background: var(--ink); color: #ffffff; font-family: var(--mono); font-weight: 600; font-size: 21px; letter-spacing: 0.06em; text-transform: uppercase; }
h1 { margin: 0; font-size: 132px; line-height: 0.88; font-weight: 800; font-stretch: 72%; letter-spacing: -0.02em; white-space: nowrap; }
h1 span { display: block; }
.address { margin: 0; font-family: var(--mono); font-weight: 600; font-size: 26px; letter-spacing: 0.02em; }

/* Right: the black departures board */
.board { align-self: center; background: var(--ink); color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 30px 50px -28px rgba(15, 17, 20, 0.6); }
.board-head { padding: 22px 26px 18px; font-family: var(--mono); font-weight: 600; font-size: 21px; letter-spacing: 0.08em; color: var(--sun); }
.board ol { list-style: none; margin: 0; padding: 0; }
.board li { display: flex; align-items: center; gap: 22px; height: 82px; padding: 0 26px; border-top: 2px solid var(--board-line); }
.board b { width: 76px; font-family: var(--mono); font-weight: 600; font-size: 30px; letter-spacing: 0.04em; color: var(--sun); }
.board span { font-weight: 700; font-size: 34px; white-space: nowrap; }
</style>
</head>
<body>
<div class="text">
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path transform="rotate(45 12 12)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></span>{BRAND}</div>
  <div>
    <p class="kicker">{KICKER}</p>
    <h1><span>{HEADLINE_A}</span><span>{HEADLINE_B}</span></h1>
  </div>
  <p class="address">{ADDRESS}</p>
</div>
<div class="board">
  <div class="board-head">{ORIGIN} &rarr;</div>
  <ol>{ROWS}</ol>
</div>
</body>
</html>
