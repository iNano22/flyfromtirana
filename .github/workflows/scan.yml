name: Scan flights

on:
  schedule:
    # Every 3 hours (UTC). Minute 17 instead of :00 because GitHub delays
    # jobs scheduled at the top of the hour when it's busy.
    - cron: "17 */3 * * *"
  workflow_dispatch:            # "Run workflow" button in the Actions tab
    inputs:
      dry_run:
        description: "Dry run: print posts in the log instead of sending them"
        type: boolean
        default: false

permissions:
  contents: write               # needed to commit data/prices.db and docs/ back to the repo

concurrency:
  group: scan                   # never two runs at once (they'd fight over prices.db)
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan and post
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_PREMIUM_CHANNEL_ID: ${{ secrets.TELEGRAM_PREMIUM_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m src.main --dry-run
          else
            python -m src.main
          fi

      # The website (docs/) is rendered from the database, so it's rebuilt after
      # every scan. Also runs after a failed scan: the prices saved so far still count.
      - name: Build website
        if: ${{ !cancelled() }}
        env:
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: python -m src.website

      # Runs even if the scan step failed: if 2 of 3 posts went out before an
      # error, they must be remembered or the next run would post them again.
      - name: Commit price history and website
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f data/prices.db ]; then echo "No database yet"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          if [ -d docs ]; then git add docs; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: update price history and website [skip ci]"
          git pull --rebase
          git push
